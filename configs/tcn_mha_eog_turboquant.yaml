# ============================================================
# Ablation 1 — TCN + MHA Transformer (EOG artifact)
# ============================================================

# --- Model ---
variant: "tcn_mha"
hidden_channels: 64
n_heads: 4
n_attn_layers: 2
max_seq_len: 512

# --- Data ---
artifact: "EOG"
data_dir: "./data/EEGdenoisenet/data/"
batch_size: 32
snr_range_db: [-7.0, 2.0]
master_seed: 42

# --- Training ---
learning_rate: 5.0e-4
attn_lr_scale: 3.0          # attention gets 3x base LR
weight_decay: 0.0
max_epochs: 100
log_every: 20

# --- Scheduler (CosineAnnealing + linear warmup) ---
sched_warmup_epochs: 5
eta_min: 1.0e-6

# --- Staged training (two-phase) ---
# Phase 1: freeze TCN, train attention only for warmup_epochs
# Phase 2: unfreeze all, joint fine-tuning for remaining epochs
staged: false
warmup_epochs: 20
warmup_lr: 1.0e-3               # Phase 1: attention-only LR
finetune_lr: 5.0e-4             # Phase 2: base LR (attention gets ×attn_lr_scale)

# --- Loss function ---
loss_fn: "l1_combined"              # "l1_combined", "l2_combined", "mse", "l1", or "stft"

# --- Output ---
save_dir: "./runs/tcn_mha_eog_turboquant"
tensorboard: false

# Optional TurboQuant (works with any n_attn_layers, including 10/20/50).
turboquant: true
turboquant_bits: 3           # total per-coordinate bits; norms/padding are extra
turboquant_key_mode: "prod"  # prod: scalar quantization + QJL; mse: scalar only
turboquant_train_mode: "off" # off: evaluation only; ste: straight-through training
turboquant_seed: 42
