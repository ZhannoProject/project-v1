# Strict methodology preset. For comparisons use experiment.paper plan, which
# derives a shared crop from ALL compared architectures and output delays.
profile: paper
protocol: paper
variant: tcn_se
hidden_channels: 64
se_reduction: 8
tcn_norm: none
se_window: 16
artifact: BOTH
normalization: fixed
resampling: causal
loss_fn: mse
selection_metric: gt_mse
max_epochs: 200
learning_rate: 0.0005
attn_lr_scale: 1.0
master_seed: 42
output_delay: 0
hop: 4
# Includes TCN, SE, delayed ell<=32 and the finite-window SE offline reference.
# Default SE causal context: 125 + 5*(16-1) = 200 samples.
valid_history_samples: 200
valid_future_samples: 102
save_dir: runs/paper_se_fixed_window16_delay0_s42
