# ============================================================
# Ablation 1 — TCN + MLA Transformer (EOG artifact)
# ============================================================

# --- Model ---
variant: "tcn_mla"
hidden_channels: 64
n_heads: 4
n_attn_layers: 2
max_seq_len: 512
kv_lora_rank: 16             # 4x KV cache vs MHA (2*d_model/rank = 2*32/16).
                             # d_model is 32, not 64: bottleneck_ratio 0.5 squeezes
                             # the 64 TCN channels before attention. The constructor
                             # default (d_model // 4) would be 8, i.e. 8x.

# --- Data ---
artifact: "EOG"
data_dir: "./data/EEGdenoisenet/data/"
batch_size: 32
snr_range_db: [-7.0, 2.0]
master_seed: 42

# --- Training ---
learning_rate: 5.0e-4
attn_lr_scale: 3.0           # attention gets 3x base LR
weight_decay: 0.0
max_epochs: 100
log_every: 20

# --- Scheduler (CosineAnnealing + linear warmup) ---
sched_warmup_epochs: 5
eta_min: 1.0e-6

# --- Staged training (two-phase) ---
staged: false
warmup_epochs: 20
warmup_lr: 1.0e-3
finetune_lr: 5.0e-4

# --- Loss function ---
loss_fn: "l1_combined"              # "l1_combined", "l2_combined", "mse", "l1", or "stft"

# --- Output ---
save_dir: "./runs/tcn_mla_eog_turboquant"
tensorboard: false

# Optional TurboQuant (works with any n_attn_layers, including 10/20/50).
turboquant: true
turboquant_bits: 3           # total per-coordinate bits; norms/padding are extra
turboquant_key_mode: "prod"  # prod: scalar quantization + QJL; mse: scalar only
turboquant_train_mode: "off" # off: evaluation only; ste: straight-through training
turboquant_seed: 42
