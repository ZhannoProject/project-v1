# ============================================================
# KD student — causal TCN + MHA distilled from its bidirectional teacher
#
# Train the teacher first:
#     python -m trainer --config configs/tcn_mha_bi_eog.yaml
# then this preset:
#     python -m trainer --config configs/tcn_mha_eog_kd.yaml
#
# The student is the ordinary deployable tcn_mha (same weights and
# shapes as the teacher, causal attention).  Everything below the KD
# block matches configs/tcn_mha_eog.yaml so the only difference to
# that run is the distillation signal.
# ============================================================

# --- Model (student) ---
variant: "tcn_mha"
hidden_channels: 64
n_heads: 4
n_attn_layers: 2
max_seq_len: 512

# --- Knowledge distillation (see trainer/distillation.py) ---
teacher_ckpt: "./runs/tcn_mha_bi_eog/best.pt"
kd_alpha: 0.5                # 0.5 * loss(student, teacher) + 0.5 * loss(student, clean)
kd_feature_weight: 0.1       # + 0.1 * MSE(student.decoder, teacher.decoder); 0 disables
kd_feature_layers: ["decoder"]
kd_output_loss: null         # null → same as loss_fn
kd_feature_loss: "mse"
init_from_teacher: true      # start from the teacher's weights (identical shapes)

# --- Data ---
artifact: "EOG"
data_dir: "./data/EEGdenoisenet/data/"
batch_size: 32
snr_range_db: [-7.0, 2.0]
master_seed: 42

# --- Training ---
learning_rate: 5.0e-4
attn_lr_scale: 3.0           # attention gets 3x base LR
weight_decay: 0.0
max_epochs: 100
log_every: 20

# --- Scheduler (CosineAnnealing + linear warmup) ---
sched_warmup_epochs: 5
eta_min: 1.0e-6

# --- Staged training (two-phase) ---
staged: false
warmup_epochs: 20
warmup_lr: 1.0e-3
finetune_lr: 5.0e-4

# --- Loss function ---
loss_fn: "l1_combined"              # "l1_combined", "l2_combined", "mse", "l1", or "stft"

# --- Output ---
save_dir: "./runs/tcn_mha_eog_kd"
tensorboard: false
