# ============================================================
# Reproducibility CI — proves the code trains and evaluates
# from scratch, with zero manual setup.
#
# Runs on every push and PR to main.
# Badge: add this to your README / paper appendix:
#   ![reproduce](https://github.com/ZhannoProject/project-v1/actions/workflows/reproduce.yml/badge.svg)
# ============================================================

name: Reproduce

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      # ---- Checkout ----
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Python + cache ----
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ---- Install dependencies ----
      # Install CPU-only PyTorch to keep CI fast and small (~200 MB vs ~2 GB)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # ---- Run the full reproducibility suite ----
      - name: Run reproduce.py
        run: python reproduce.py

      - name: Run regression and methodology tests
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: python -m unittest discover -s tests

      # ---- Upload any artifacts produced during the run ----
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-artifacts
          path: |
            runs/
            *.log
          if-no-files-found: ignore
          retention-days: 7
